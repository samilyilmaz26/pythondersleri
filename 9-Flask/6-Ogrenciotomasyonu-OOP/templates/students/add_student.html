{% extends 'copy/layout.html' %}
{% block page %}
<h3>Öğrenci Ekle</h3>
<hr>
    <form action="{{ url_for('add_student') }}" method="post">
        <div class="col-md-5">
            <label for="ad" class="form-label">Ad</label>
            <input type="text" class="form-control" id="ad" name="ad" required>
            
            <label for="soyad" class="form-label">Soyad</label>
            <input type="text" class="form-control" id="soyad" name="soyad" required>

            <label for="bolumid" class="form-label">Bölüm</label>
             <select class="form-control" id="bolumid" name="bolumid" required>
                <option value="">Bölüm Seçin</option>
                {% for department in bolumler %}
                    <option value="{{ department.id }}">{{ department.bolumad }}</option>
                {% endfor %}
            </select>

            <label for="mahalle" class="form-label">Mahalle</label>
            <input type="text" class="form-control" id="mahalle" name="mahalle">

            <label for="cadde" class="form-label">Cadde</label>
            <input type="text" class="form-control" id="cadde" name="cadde">

            <label for="kapino" class="form-label">Kapı No</label>
            <input type="text" class="form-control" id="kapino" name="kapino">

            <label for="city" class="form-label">Şehir</label>
            <input type="text" class="form-control" id="city" name="city">

            <button type="submit" class="btn btn-primary">Ekle</button>
        </div>
    </form>
{% endblock %}
