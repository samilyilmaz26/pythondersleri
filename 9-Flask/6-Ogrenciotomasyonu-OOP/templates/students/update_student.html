{% extends 'copy/layout.html' %}
{% block page %}
{% set student = ogrenci %}
<h3>Öğrenci Güncelle</h3>
<hr>
<H2>{{student.full_name}}</H2>
    <form   method="post">
        <div class="col-md-5">
            <label for="ad" class="form-label">Adı</label>
            <input type="text" class="form-control" id="ad" name="ad" required  value="{{ student.ad }}">

            <label for="soyad" class="form-label">Soyadı</label>
            <input type="text" class="form-control" id="soyad" name="soyad" required  value="{{ student.soyad }}">

            <label for="bolumid" class="form-label">Bölüm</label>
            <select class="form-select" id="bolumid" name="bolumid" required>
                {% for department in bolumler %}
                {% if department.id == student.bolumid %}
                <option value= "{{department.id}}" selected>{{ department.bolumad }}</option>
                {% else %}
                 <option value= "{{department.id}}">{{ department.bolumad }}</option>
                {% endif %}
                {% endfor %}
            </select>

            <label for="mahalle" class="form-label">Mahalle</label>
            <input type="text" class="form-control" id="mahalle" name="mahalle" value="{{ student.mahalle }}">

            <label for="cadde" class="form-label">Cadde</label>
            <input type="text" class="form-control" id="cadde" name="cadde" value="{{ student.cadde }}">

            <label for="kapino" class="form-label">Kapı No</label>
            <input type="text" class="form-control" id="kapino" name="kapino" value="{{ student.kapino }}">

            <label for="city" class="form-label">Şehir</label>
            <input type="text" class="form-control" id="city" name="city" value="{{ student.city }}">

            <button type="submit" class="btn btn-primary">Güncelle</button>
        </div>
    </form>
{%endblock %}
