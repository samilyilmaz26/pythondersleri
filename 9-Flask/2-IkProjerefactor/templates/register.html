{%extends "layout.html"%}
{%block page%}

<h3>Kayıt Olma </h3>
<hr>
<form method="post">
  <div class="row ">
    <div class="col-md-5">
       <div class="mb-3">
        <label for="user" class="form-label">User Name</label>
        <input type="text" class="form-control" id="user" name="username" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" name="email" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>
      <div class="mb-3">
        <label for="confirm" class="form-label">Password Repeat</label>
        <input type="password" class="form-control" id="confirm" name="confirm">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="accept_tos" name="accept_tos" value="1">
        <label class="form-check-label" for="accept_tos">Accept TOS</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>
</form>
{%endblock page%}
